[project]
name = "omphalos"
version = "2.0.0"
description = "Local transaction investigations with traceable evidence and explicit analytical review"
authors = [{name = "Peter H. Vartanian"}]
license = "CC0-1.0"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.14.1,<3",
    "cryptography>=50.0.2,<51",
    "truststore>=0.10,<1"
]

[project.scripts]
omphalos = "omphalos.cli:main"

[tool.poetry]
packages = [{include = "omphalos", from = "src"}]
include = [
    {path = "poetry.lock", format = "sdist"},
    {path = "package.json", format = "sdist"},
    {path = "package-lock.json", format = "sdist"},
    {path = "eslint.config.mjs", format = "sdist"},
    {path = ".prettierrc.json", format = "sdist"},
    {path = "src/omphalos/ui/*", format = ["sdist", "wheel"]},
    {path = "docs/*.md", format = "sdist"},
    {path = "examples/*.json", format = "sdist"},
    {path = "examples/import/*.csv", format = "sdist"},
    {path = "native/README.md", format = "sdist"},
    {path = "native/go/*.go", format = "sdist"},
    {path = "native/go/go.mod", format = "sdist"},
    {path = "native/rust/Cargo.*", format = "sdist"},
    {path = "native/rust/src/*.rs", format = "sdist"},
    {path = "tests/*.py", format = "sdist"},
    {path = "tools/*.py", format = "sdist"},
    {path = "Start omphalOS.command", format = "sdist"},
    {path = "Start omphalOS.cmd", format = "sdist"},
    {path = "SECURITY.md", format = "sdist"},
    {path = "CONTRIBUTING.md", format = "sdist"},
    {path = ".github/workflows/test.yml", format = "sdist"}
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"
hypothesis = ">=6.130,<7"
ruff = ">=0.12,<1"
build = ">=1.2,<2"
black = ">=25,<27"
pip-audit = ">=2.9,<3"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
