[tool.poetry]
name = "omphalos"
version = "2.0.0"
description = "Local transaction investigations with traceable evidence and explicit analytical review"
authors = ["Peter H. Vartanian"]
license = "CC0-1.0"
readme = "README.md"
packages = [{include = "omphalos", from = "src"}]
include = ["src/omphalos/ui/**/*"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = ">=2.14.1,<3"
cryptography = ">=50.0.2,<51"
truststore = ">=0.10,<1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"
hypothesis = ">=6.130,<7"
ruff = ">=0.12,<1"
build = ">=1.2,<2"
black = ">=25,<27"
pip-audit = ">=2.9,<3"

[tool.poetry.scripts]
omphalos = "omphalos.cli:main"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
