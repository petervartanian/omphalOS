[package]
name = "omphalos-integrity-verifier"
version = "2.0.0"
edition = "2021"
rust-version = "1.74"
description = "Independent file inventory verification for omphalOS evidence records"
license = "CC0-1.0"

[dependencies]
serde = "1.0"
