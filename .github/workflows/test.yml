name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run pytest
      - run: poetry run ruff check src tests
      - run: poetry run black --check src tests tools
      - run: poetry build
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run python tools/check_native.py
