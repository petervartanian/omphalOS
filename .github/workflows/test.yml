name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/omphalos-browser-runtime
          key: browser-runtime-${{ hashFiles('deploy/browser-runtime.lock.json') }}
      - name: Build the static browser edition from verified runtime artifacts
        run: python tools/build_browser.py --cache "$RUNNER_TEMP/omphalos-browser-runtime"
      - name: Verify the actual WebAssembly workflow with network disabled
        run: node tools/check_browser_runtime.mjs dist/browser
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run pytest
      - run: poetry run ruff check src tests
      - run: poetry run black --check src tests tools
      - run: poetry build
  team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --extras team --no-interaction
      - run: poetry run pytest -q tests/test_team_server.py tests/test_team_frontend.py
      - run: poetry run python -m omphalos team serve --help
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: rustup default 1.99.0
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run python tools/check_native.py
